<div class="app-shell" [class.gated]="blocked()" [inert]="blocked()" [attr.aria-hidden]="blocked() ? 'true' : null">
  <app-header />
  <main>
    <router-outlet />
  </main>
  @if (compare.count() > 0) {
    <div class="compare-bar">
      <strong>{{ compare.count() }} veículo(s) na comparação</strong>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" type="button" (click)="compare.clear()">Limpar</button>
        <a routerLink="/comparar" class="btn btn-primary">Comparar agora</a>
      </div>
    </div>
  }
  <app-footer />
</div>
<app-location-consent />
