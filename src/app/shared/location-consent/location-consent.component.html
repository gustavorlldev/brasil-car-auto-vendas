@if (visible()) {
  <aside class="banner" role="dialog" aria-labelledby="geo-title">
    <div>
      <p class="eyebrow" id="geo-title">Localização</p>
      <p>
        A Brasil Cars pode usar sua localização aproximada para o atendimento da loja em Blumenau.
        Só enviamos ao painel interno se você aceitar.
      </p>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" type="button" (click)="visits.deny()">Agora não</button>
      <button class="btn btn-primary" type="button" (click)="accept()" [disabled]="visits.capturing()">
        {{ visits.capturing() ? 'Obtendo…' : 'Aceitar localização' }}
      </button>
    </div>
  </aside>
}
